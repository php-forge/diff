<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Git-Compatible Line Diff</text>
        <text class="content" x="40" y="78">Port of Git&#8217;s xdiff &#8226; Myers alignment &#8226; Indent heuristic</text>
        <text class="content" x="40" y="98">Same edit scripts as git diff with default settings</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Unified Diff Renderer</text>
        <text class="content" x="630" y="78">Output of git diff --unified &#8226; Function context</text>
        <text class="content" x="630" y="98">Renders the scripts of any DifferInterface implementation</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Linear Memory, Readable Scripts</text>
        <text class="content" x="40" y="198">O((N + M) &#183; D) time with linear memory</text>
        <text class="content" x="40" y="218">Repeated lines never anchor unrelated changes</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Zero Runtime Dependencies, PHP 8.3+</text>
        <text class="content" x="630" y="198">No runtime dependencies &#8226; No framework required</text>
        <text class="content" x="630" y="218">CI matrix: PHP 8.3, 8.4, 8.5 on Ubuntu and Windows</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Tested with Testo</text>
        <text class="content" x="40" y="318">Testo unit tests and benchmarks &#8226; Codecov integration</text>
        <text class="content" x="40" y="338">Infection mutation testing with 100% MSI requirement</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">PHPStan Level Max</text>
        <text class="content" x="630" y="318">Strict rules &#8226; ECS coding standard &#8226; Rector</text>
        <text class="content" x="630" y="338">Composer Require Checker &#8226; Markdown and YAML linters</text>
    </g>
</svg>
