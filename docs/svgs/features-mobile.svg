<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 416" width="100%" height="389" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Git-Compatible Line Diff</text>
        <text class="content" x="32" y="66">Port of Git&#8217;s xdiff &#8226; Myers alignment &#8226; Indent heuristic</text>
        <text class="content" x="32" y="84">Same edit scripts as git diff, short of Git&#8217;s cost limit</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Unified Diff Renderer</text>
        <text class="content" x="32" y="166">Unified diff in Git&#8217;s format &#8226; Function context</text>
        <text class="content" x="32" y="184">Renders the scripts of any DifferInterface implementation</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Linear Memory, Readable Scripts</text>
        <text class="content" x="32" y="266">O((N + M) &#183; D) time with linear memory</text>
        <text class="content" x="32" y="284">Repeated lines never anchor unrelated changes</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Zero Runtime Dependencies, PHP 8.3+</text>
        <text class="content" x="32" y="366">No runtime dependencies &#8226; No framework required</text>
        <text class="content" x="32" y="384">CI matrix: PHP 8.3, 8.4, 8.5 on Ubuntu and Windows</text>
    </g>
</svg>
